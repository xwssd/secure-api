name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-scan:
    name: Tests, SAST and SCA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run functional and security regression tests
        run: pytest -q

      - name: SAST - bandit
        run: |
          bandit -r app -ll -f txt -o bandit-report.txt
          cat bandit-report.txt

      - name: SCA - pip-audit (known vulnerabilities in dependencies)
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json
          pip-audit -r requirements.txt

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.txt
            pip-audit-report.json
          if-no-files-found: warn
